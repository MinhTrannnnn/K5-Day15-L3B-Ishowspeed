services:
  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 3s
      timeout: 5s
      retries: 30

  model-init:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL_NAME: "${CP3_MODEL:-qwen2.5:1.5b}"
      MODEL_PROVIDER: "${CP3_PROVIDER:-ollama}"
    entrypoint: [/bin/sh, -ec]
    command: ['[ "$$MODEL_PROVIDER" != ollama ] || ollama show "$$MODEL_NAME" >/dev/null 2>&1 || exec ollama pull "$$MODEL_NAME"']
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build: .
    environment:
      MODEL_PROVIDER: "${CP3_PROVIDER:-ollama}"
      CP3_MODEL: "${CP3_MODEL:-qwen2.5:1.5b}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.4-nano}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OLLAMA_URL: http://ollama:11434
    depends_on:
      model-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - cases:/app/data/runtime
      - ./eval:/app/eval
      - ./cost:/app/cost
      - ./traces:/app/traces
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  models:
  cases:
