# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Mọi giả định chưa có số đo được đánh dấu tự ước tính; không dùng quy mô học viên track A.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # quy mô khách hàng mục tiêu dùng thử mỗi tháng, không phải tổng người dùng ShopeeFood
  low: 100          # tự ước tính
  base: 300         # tự ước tính
  high: 1000        # tự ước tính
  source: "(tự ước tính) Ba quy mô pilot của nhóm khách có thể dùng công cụ hỗ trợ khiếu nại; chưa có dữ liệu triển khai hoặc số người dùng sản phẩm."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.7              # tự ước tính
    uses_per_month: 1       # tự ước tính
    turns_per_session: 1    # tự ước tính
    source: "(tự ước tính) 70% người dùng pilot, 1 khiếu nại/tháng, 1 lượt hỏi/phiên; chưa khảo sát tần suất."
  - name: dung_vua
    share: 0.25             # tự ước tính
    uses_per_month: 2       # tự ước tính
    turns_per_session: 2    # tự ước tính
    source: "(tự ước tính) 25% người dùng pilot, 2 khiếu nại/tháng, 2 lượt hỏi/phiên; chưa khảo sát tần suất."
  - name: dung_nhieu
    share: 0.05             # tự ước tính
    uses_per_month: 4       # tự ước tính
    turns_per_session: 3    # tự ước tính
    source: "(tự ước tính) 5% người dùng pilot, 4 khiếu nại/tháng, 3 lượt hỏi/phiên; chưa khảo sát tần suất."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu text token; giá Standard, không tính cache/Batch
  - model: gpt-5.4-nano-2026-03-17
    input: 0.20
    output: 1.25
    source: "https://developers.openai.com/api/docs/models/gpt-5.4-nano · xem 28/11/2026; model thực đo"
  - model: gpt-5.4-mini-2026-03-17
    input: 0.75
    output: 4.50
    source: "https://developers.openai.com/api/docs/models/gpt-5.4-mini · xem 28/11/2026; chỉ là kịch bản giá, chưa chạy mini"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
